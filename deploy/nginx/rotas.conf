root /srv/doutor-ofertas-bot/website;
index index.html;

# Contador de cliques do CTA (navigator.sendBeacon manda POST).
location = /e {
    access_log /var/log/nginx/doutoroferta-cliques.log;
    return 204;
}

# groups.json e reescrito pelo bot; cache aqui quebra o rodizio de grupos.
location ~ ^/[a-z0-9-]+/groups\.json$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# /<slug> SEM barra final serve a pagina direto, com 200. O fetcher de previa
# do WhatsApp NAO segue redirect: com 301 aqui, o card sumia.
location ~ ^/([a-z0-9-]+)$ {
    try_files /$1/index.html =404;
}

location ~* \.(webp|jpg|jpeg|png|svg|ico)$ { expires 7d; }
location ~* \.css$ { expires 7d; }

location / { try_files $uri $uri/ =404; }
