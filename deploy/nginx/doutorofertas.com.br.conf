# Doutor Ofertas - dominio OFICIAL (plural, casa com a marca).
server {
    server_name doutorofertas.com.br;
    include snippets/doutorofertas-rotas.conf;
    access_log /var/log/nginx/doutoroferta-acessos.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/doutorofertas.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/doutorofertas.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.doutorofertas.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = doutorofertas.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name doutorofertas.com.br;
    return 404; # managed by Certbot




}
# www -> apex. Uma origem canonica so: o WhatsApp guarda a previa POR URL,
# entao dois enderecos servindo o mesmo conteudo viram dois caches de card.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.doutorofertas.com.br;
    ssl_certificate /etc/letsencrypt/live/doutorofertas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doutorofertas.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://doutorofertas.com.br$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.doutorofertas.com.br;
    return 301 https://doutorofertas.com.br$request_uri;
}
