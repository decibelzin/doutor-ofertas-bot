# Doutor Ofertas - landing de perfumes.
# Arquivos gerados por `npm run build-site` no repo doutor-ofertas-bot.

server {
    server_name www.doutoroferta.com.br;
    # Uma origem canônica só: o scraper do WhatsApp guarda o card por dias e
    # duas versões do mesmo link viram dois caches diferentes.
    return 301 https://doutoroferta.com.br$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/doutoroferta.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/doutoroferta.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name doutoroferta.com.br;

    root /srv/doutor-ofertas-bot/website;
    index index.html;

    # Contador de cliques do CTA (navigator.sendBeacon). Sem cookie, sem pixel
    # de terceiro: o log é o contador, já separado por nicho no parâmetro n=.
    location = /e {
        access_log /var/log/nginx/doutoroferta-cliques.log;
        return 204;
    }

    # groups.json é reescrito pelo bot; servir cache aqui quebra o rodízio.
    location ~ ^/[a-z0-9-]+/groups\.json$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Arte tem nome estável e troca raramente.
    location ~* \.(webp|jpg|png|svg|ico)$ {
        expires 7d;
    }

    # CSS curto de propósito: ainda estamos iterando na landing.
    location ~* \.css$ {
        expires 1h;
    }

    # /<slug> SEM barra final serve a pagina direto, com 200.
    # O nginx devolvia 301 pra /<slug>/ e o fetcher de previa do WhatsApp NAO
    # segue redirect: lia a resposta vazia do 301 e o link saia sem card. Como
    # e essa a forma que a pessoa digita, o card se perdia exatamente ali.
    # Regex sem ponto de proposito: nao pega /styles.css nem /assets/*.webp,
    # e o `location = /e` (match exato) continua tendo prioridade sobre isto.
    location ~ ^/([a-z0-9-]+)$ {
        try_files /$1/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/doutoroferta.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/doutoroferta.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = doutoroferta.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name doutoroferta.com.br;
    return 404; # managed by Certbot


}

server {
    if ($host = www.doutoroferta.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.doutoroferta.com.br;
    return 404; # managed by Certbot


}