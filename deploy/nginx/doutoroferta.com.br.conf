# Doutor Ofertas - dominio APOSENTADO (singular). So encaminha pro oficial.
#
# 301 e nao 302: permanente e o que faz o Google transferir o sinal do dominio
# velho pro novo. 302 diria "e temporario, mantenha o antigo no indice".
#
# ⚠️ O redirect fica em `location /`, NAO no nivel do server. `return` no server
# roda na fase de rewrite, ANTES da selecao de location — entao a excecao do
# arquivo de verificacao nunca era alcancada. Em location, a correspondencia
# exata (=) ganha do prefixo (/), que e o que queremos.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name doutoroferta.com.br www.doutoroferta.com.br;

    ssl_certificate /etc/letsencrypt/live/doutoroferta.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doutoroferta.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Verificacao do Search Console tem que responder 200 NESTE dominio: se so
    # redirecionar, o Google pode considerar a propriedade antiga
    # nao-verificada — e some a Mudanca de Endereco, que e o que transfere o
    # indice do velho pro novo.
    location = /google084a3b6d23d1cb64.html {
        root /srv/doutor-ofertas-bot/website;
    }

    location / {
        return 301 https://doutorofertas.com.br$request_uri;
    }
}
