<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doutor Ofertas - ofertas e cupons todo dia no WhatsApp</title>
<meta name="description" content="Grupos de WhatsApp com ofertas e cupons de verdade, todo dia. Escolha o seu.">
<meta name="theme-color" content="#0A0A0B">
<meta name="color-scheme" content="dark">

<!-- Reivindicacao do dominio no Pinterest - ver o comentario equivalente em
     landing.template.html. As duas paginas carregam a mesma tag porque a
     reivindicacao vale pro dominio, e foi a raiz que o Pinterest recebeu. -->
<meta name="p:domain_verify" content="4328c84829fabca4b7877ddbdcf3c451"/>

<!-- Esta pagina existe pra BUSCA POR MARCA. Nenhum anuncio aponta pra ca:
     campanha vai direto pra /<nicho>, que e a landing de conversao. Aqui e
     onde cai quem digita o dominio ou procura "doutor ofertas" no Google. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Doutor Ofertas">
<meta property="og:locale" content="pt_BR">
<meta property="og:url" content="https://doutorofertas.com.br/">
<meta property="og:title" content="Doutor Ofertas - ofertas e cupons todo dia no WhatsApp">
<meta property="og:description" content="Grupos de WhatsApp com ofertas e cupons de verdade, todo dia. Escolha o seu.">
<meta property="og:image" content="https://doutorofertas.com.br/perfumes/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="canonical" href="https://doutorofertas.com.br/">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://doutorofertas.com.br/#organizacao",
      "name": "Doutor Ofertas",
      "url": "https://doutorofertas.com.br/",
      "logo": "https://doutorofertas.com.br/assets/logo.jpg",
      "description": "Grupos de WhatsApp com ofertas e cupons de verdade, todo dia. Escolha o seu."
    },
    {
      "@type": "WebSite",
      "@id": "https://doutorofertas.com.br/#site",
      "url": "https://doutorofertas.com.br/",
      "name": "Doutor Ofertas",
      "inLanguage": "pt-BR",
      "publisher": {
        "@id": "https://doutorofertas.com.br/#organizacao"
      }
    }
  ]
}
</script>
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/styles.css?v=2fc6a486">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
      media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap"></noscript>
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<main class="screen hub">

  <header class="top">
    <div class="logo-ring">
      <picture>
        <source srcset="/assets/logo.webp" type="image/webp">
        <img class="logo" src="/assets/logo.jpg" alt="Doutor Ofertas"
             width="560" height="560" fetchpriority="high" decoding="async">
      </picture>
    </div>
    <p class="brand">DOUTOR OFERTAS</p>
  </header>

  <section class="middle">
    <h1 class="headline-hub">OFERTAS DE VERDADE, TODO DIA</h1>
    <p class="support">Escolha o grupo que combina com você</p>
  </section>

  <!-- Um item por nicho, gerado de config/landings.json. Sao <a> de verdade:
       o crawler segue link, e e assim que ele descobre as paginas de nicho a
       partir da raiz. -->
  <nav class="nichos">
    <a class="nicho" href="/perfumes">
      <span class="nicho-nome">PERFUME ÁRABE E IMPORTADO ATÉ <b>70% OFF</b></span>
      <span class="nicho-seta" aria-hidden="true">›</span>
    </a>
  </nav>

  <footer class="foot">
    <p>Você compra na Shopee e no Mercado Livre. Ganhamos comissão das lojas, você paga o mesmo.</p>
  </footer>

</main>
</body>
</html>
