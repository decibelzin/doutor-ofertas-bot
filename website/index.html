<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doutor Ofertas — Perfume importado até 70% OFF</title>
<meta name="description" content="Ofertas e cupons de perfume todo dia no WhatsApp. Árabes, importados e nacionais. Entrar é grátis.">
<meta name="theme-color" content="#0A0A0B">

<!-- Compartilhamento (WhatsApp/Instagram) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Doutor Ofertas — Perfume importado até 70% OFF">
<meta property="og:description" content="Ofertas e cupons de perfume todo dia no WhatsApp. Entrar é grátis.">
<meta property="og:image" content="./assets/og.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="./assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<main class="screen">

  <!-- ── Marca ── -->
  <header class="top">
    <div class="logo-ring">
      <img class="logo" src="./assets/logo.png" alt="Doutor Ofertas" width="96" height="96">
    </div>

    <p class="brand">
      DOUTOR OFERTAS
      <svg class="verified" viewBox="0 0 24 24" aria-label="Verificado" role="img">
        <path fill="currentColor" fill-rule="evenodd" d="M23 12l-2.44-2.79.34-3.69-3.61-.82-1.89-3.2L12 2.96 8.6 1.5 6.71 4.69 3.1 5.5l.34 3.7L1 12l2.44 2.79-.34 3.7 3.61.82L8.6 22.5l3.4-1.47 3.4 1.46 1.89-3.19 3.61-.82-.34-3.69L23 12zm-12.91 4.72l-3.8-3.81 1.48-1.48 2.32 2.33 5.85-5.87 1.48 1.48-7.33 7.35z"/>
      </svg>
    </p>
  </header>

  <!-- ── Chamada ── -->
  <section class="middle">
    <h1 class="headline">
      PERFUME IMPORTADO ATÉ <span class="gold">70% OFF</span>
    </h1>
    <p class="support">Ofertas e cupons todo dia no WhatsApp.</p>
  </section>

  <!-- ── Ação ── -->
  <section class="bottom">
    <!-- Preenchido pelo JS com a vaga REAL do grupo (via groups.json). -->
    <p class="vagas" id="vagas" hidden></p>

    <a class="cta" id="cta" href="https://chat.whatsapp.com/J1Gjfc5xgqr66cTUmzNG98" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path fill="currentColor" d="M17.472 14.382c-.3-.149-1.777-.878-2.046-.974-.269-.099-.465-.148-.659.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.647.075-.3-.15-1.265-.465-2.403-1.485-.885-.79-1.484-1.77-1.66-2.07-.174-.3-.019-.465.13-.614.135-.133.3-.347.45-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.659-1.591-.903-2.175-.24-.575-.48-.497-.659-.505-.17-.008-.363-.01-.557-.01-.194 0-.51.072-.776.364-.267.292-1.018 1.001-1.018 2.44 0 1.439 1.047 2.827 1.192 3.025.145.199 2.062 3.148 4.993 4.413.697.301 1.242.481 1.667.617.7.222 1.336.19 1.84.115.56-.083 1.778-.727 2.026-1.428.248-.7.248-1.304.174-1.428-.074-.124-.269-.198-.57-.347zM12 21.365c-1.637 0-3.238-.44-4.636-1.272l-.332-.198-3.446.904.92-3.36-.217-.345A9.324 9.324 0 0 1 3.045 12c0-5.163 4.2-9.363 9.366-9.363 2.503 0 4.856.974 6.623 2.742a9.297 9.297 0 0 1 2.742 6.621c0 5.165-4.2 9.365-9.366 9.365h-.01z"/>
      </svg>
      ENTRAR NO GRUPO GRÁTIS
    </a>

    <p class="cta-note">Grátis · Sem cadastro · Saia quando quiser</p>
  </section>

  <footer class="foot">
    <p>Não vendemos nada. Só mostramos onde está barato.</p>
  </footer>

</main>

<script>
  /* Aponta o botão pro grupo que TEM VAGA.
     O bot roda na mesma VPS e reescreve groups.json a cada poucos minutos com a
     contagem real de membros e o link de convite. Se o arquivo faltar, o href
     de reserva do HTML continua valendo — a página nunca fica sem CTA. */
  (async () => {
    const cta = document.getElementById('cta');
    const vagas = document.getElementById('vagas');
    if (!cta) return;
    try {
      const res = await fetch('./groups.json', { cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();
      if (data.join) {
        cta.href = data.join;
        const g = (data.groups || []).find((x) => x.link === data.join);
        if (vagas && g && g.vacancies > 0 && g.vacancies <= 300) {
          vagas.textContent = 'RESTAM ' + g.vacancies + ' VAGAS NESTE GRUPO';
          vagas.hidden = false;
        }
      } else if (vagas) {
        vagas.textContent = 'GRUPOS LOTADOS — TURMA NOVA EM BREVE';
        vagas.hidden = false;
      }
    } catch (e) { /* offline: mantém o href de reserva */ }
  })();
</script>
</body>
</html>
